# Server deployment: nginx is the only published port. Required settings live
# in a .env file next to this one (see .env.production.example); compose
# refuses to start while any of them is missing.
#
# Database switch: the API serves the "global" (multi-user) database. By
# default that is the postgres service below; point GLOBAL_DATABASE_URL at a
# managed Postgres (with ?sslmode=require) to use one instead.

x-hardened: &hardened
  restart: always
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    <<: *hardened
    image: postgres:15-alpine
    container_name: samaritan_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-acpe}
    # Not published: reach it with `docker compose -f docker-compose.prod.yml exec postgres psql`.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-acpe}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    <<: *hardened
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: samaritan_api
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_TARGET: ${DATABASE_TARGET:-global}
      GLOBAL_DATABASE_URL: ${GLOBAL_DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-acpe}?schema=public}
      LOCAL_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-acpe}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random characters) in .env}
      # Empty keeps the code default: open for the global database, closed for local.
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-}
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN (e.g. https://samaritan.example.com) in .env}
      AUTH_ORIGINS: ${PUBLIC_ORIGIN}
      AUTH_COOKIE_PATH: /svc/api/auth
      # Secure cookies need HTTPS; set false only for a plain-HTTP trial on localhost.
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      TRUST_PROXY: "1"
      LOCAL_DEVICE_ENROLLMENT: "false"
      HOST: 0.0.0.0
      PORT: 4000
    expose:
      - "4000"
    networks:
      - backend
      - frontend

  dashboard:
    <<: *hardened
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/svc}
    container_name: samaritan_dashboard
    cap_drop:
      - ALL
    expose:
      - "3000"
    networks:
      - frontend

  nginx:
    <<: *hardened
    image: nginx:1.27-alpine
    container_name: samaritan_nginx
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - frontend

networks:
  frontend:
  # The database network has no route out.
  backend:
    internal: true

volumes:
  postgres_data:
