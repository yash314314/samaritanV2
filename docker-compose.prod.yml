version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: samaritan_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-acpe}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-acpe}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: samaritan_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-acpe}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-samaritan_super_secret_jwt_key_2026}
      REFRESH_SECRET: ${REFRESH_SECRET:-samaritan_super_secret_refresh_key_2026}
      PORT: 4000
    ports:
      - "4000:4000"

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: samaritan_dashboard
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: samaritan_nginx
    restart: always
    depends_on:
      - api
      - dashboard
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
