worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout 65;
  server_tokens   off;
  client_max_body_size 2m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Sign-in, refresh and registration: 10 requests a minute per client address,
  # with room for the short bursts a page load makes.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream dashboard_backend {
    server dashboard:3000;
  }

  upstream api_backend {
    server api:4000;
  }

  server {
    listen 80;
    server_name _;

    # The dashboard is a static export with inline bootstrap scripts, hence
    # 'unsafe-inline' for scripts and styles; everything else stays same-origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Once TLS terminates in front of (or in) this server, also send:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # The API sets these headers itself; keep one copy, nginx's.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
      access_log off;
      proxy_pass http://api_backend/health;
    }

    # The API lives under /svc/ so its paths (/analytics/..., /focus/...) never
    # collide with dashboard pages of the same name. The prefix is stripped.
    location /svc/api/auth/ {
      limit_req zone=auth burst=20 nodelay;
      limit_req_status 429;
      proxy_pass http://api_backend/api/auth/;
    }

    location = /svc/ws {
      proxy_pass http://api_backend/ws;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    location /svc/ {
      proxy_pass http://api_backend/;
    }

    location / {
      proxy_pass http://dashboard_backend;
    }
  }
}
