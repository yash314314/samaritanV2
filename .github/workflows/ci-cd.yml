name: SamaritanV2 CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-and-build:
    name: Build & Verify Samaritan Stack
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: acpe
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install API Dependencies & Generate Prisma Client
        run: |
          cd api
          cp .env.example .env
          npm ci
          npx prisma generate
          # migrate deploy (not db push) so a schema change without a migration fails CI
          npx prisma migrate deploy
          npm run bootstrap:user

      - name: Type Check & Verify Express API
        run: |
          cd api
          npx tsc --noEmit
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://postgres:password@localhost:5432/postgres" --exit-code
          npm test

      - name: Verify Desktop Tracker Logic
        run: |
          cd desktop
          npm ci --ignore-scripts
          npm test
          npm run verify:widget

      - name: Install Dashboard Dependencies & Build Next.js
        run: |
          cd dashboard
          npm ci
          npm run build

      - name: Build Docker Container Stack
        run: |
          docker compose -f docker-compose.prod.yml build
